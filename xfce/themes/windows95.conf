# Snapshot of the current XFCE appearance (Chicago95).
[appearance]
gtk_theme = Chicago95
icon_theme = Chicago95
# Empty theme and size 0 preserve XFCE's default cursor settings.
cursor_theme =
cursor_size = 0
font = More Perfect DOS VGA 10
monospace_font = More Perfect DOS VGA 10
# prefer_dark is not explicitly set in the current configuration.

[window_manager]
theme = Chicago95
title_font = Sans Bold 9
button_layout = O|SHMC

# No notification theme is explicitly set in the current configuration.

[panel]
theme = Windows95
