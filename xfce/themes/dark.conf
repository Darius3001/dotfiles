# These themes must already be installed. Change names to match your system.
[appearance]
gtk_theme = Adwaita-dark
icon_theme = Adwaita
cursor_theme = Adwaita
cursor_size = 24
font = Sans 10
monospace_font = Monospace 10
prefer_dark = true

[window_manager]
theme = Default
title_font = Sans Bold 10
# O = menu, T = stick, S = shade, H = minimize, M = maximize, C = close
button_layout = O|HMC

# Optional: uncomment if this notification theme is installed.
# [notifications]
# theme = Default
